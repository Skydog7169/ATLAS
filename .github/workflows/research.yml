name: Weekly data refresh

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated conflict ids to refresh (blank = all)'
        required: false
        default: ''
      limit:
        description: 'Max conflicts to process (0 = all)'
        required: false
        default: '0'

permissions:
  contents: write
  pull-requests: write
  id-token: write # lets the job fetch a GitHub OIDC token for Anthropic Workload Identity Federation

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Credentials for the research pass, in order of preference:
      #  1. Workload Identity Federation: the three ANTHROPIC_* repository *variables* (identifiers, not
      #     secrets) plus a GitHub OIDC token minted here for audience https://api.anthropic.com. The SDK
      #     exchanges it for a short-lived Anthropic token; nothing long-lived is stored anywhere.
      #  2. A classic ANTHROPIC_API_KEY repository secret.
      #  3. Neither: the pass is skipped with a warning and the generated datasets are still refreshed.
      - name: Fetch GitHub OIDC token for Anthropic
        if: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID != '' }}
        run: |
          curl -sS --fail -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).value))' \
            > "$RUNNER_TEMP/anthropic-oidc.jwt"
          echo "ANTHROPIC_IDENTITY_TOKEN_FILE=$RUNNER_TEMP/anthropic-oidc.jwt" >> "$GITHUB_ENV"
          echo "ANTHROPIC_FEDERATION_RULE_ID=${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}" >> "$GITHUB_ENV"
          echo "ANTHROPIC_ORGANIZATION_ID=${{ vars.ANTHROPIC_ORGANIZATION_ID }}" >> "$GITHUB_ENV"
          echo "ANTHROPIC_SERVICE_ACCOUNT_ID=${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}" >> "$GITHUB_ENV"
          if [ -n "${{ vars.ANTHROPIC_WORKSPACE_ID }}" ]; then echo "ANTHROPIC_WORKSPACE_ID=${{ vars.ANTHROPIC_WORKSPACE_ID }}" >> "$GITHUB_ENV"; fi

      - name: Research pass
        env:
          # Passed under another name: an empty ANTHROPIC_API_KEY in the environment would shadow federation.
          API_KEY_SECRET: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_IDENTITY_TOKEN_FILE" ] && [ -n "$ANTHROPIC_ORGANIZATION_ID" ] && [ -n "$ANTHROPIC_SERVICE_ACCOUNT_ID" ]; then
            echo "Authenticating with Workload Identity Federation (rule $ANTHROPIC_FEDERATION_RULE_ID)."
            # The SDK re-exchanges the JWT whenever its Anthropic token nears expiry, and Anthropic rejects a
            # replayed JWT, so keep a fresh GitHub OIDC token in the file for the whole (long) pass.
            (
              while sleep 240; do
                curl -sS --fail -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                  "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
                  | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).value))' \
                  > "$ANTHROPIC_IDENTITY_TOKEN_FILE.next" && mv "$ANTHROPIC_IDENTITY_TOKEN_FILE.next" "$ANTHROPIC_IDENTITY_TOKEN_FILE"
              done
            ) &
            trap 'kill %1 2>/dev/null || true' EXIT
          elif [ -n "$API_KEY_SECRET" ]; then
            export ANTHROPIC_API_KEY="$API_KEY_SECRET"
            echo "Authenticating with the ANTHROPIC_API_KEY secret."
          else
            echo "::warning::No Anthropic credentials: set the ANTHROPIC_FEDERATION_RULE_ID, ANTHROPIC_ORGANIZATION_ID and ANTHROPIC_SERVICE_ACCOUNT_ID repository variables (Workload Identity Federation) or an ANTHROPIC_API_KEY secret. Skipping the research pass; the generated datasets below are still refreshed."
            printf '## Data refresh %s\n\nResearch pass skipped: no Anthropic credentials are configured. Generated datasets were refreshed from their APIs.\n' "$(date -u +%F)" > research-report.md
            exit 0
          fi
          ARGS=""
          [ -n "${{ inputs.only }}" ] && ARGS="$ARGS --only ${{ inputs.only }}"
          [ "${{ inputs.limit }}" != "0" ] && [ -n "${{ inputs.limit }}" ] && ARGS="$ARGS --limit ${{ inputs.limit }}"
          node scripts/research/update.mjs --report research-report.md $ARGS

      - name: Refresh UNHCR displacement figures
        run: node scripts/build-displacement.mjs

      - name: Refresh World Bank figures
        run: node scripts/build-worldbank.mjs

      - name: Refresh sanctions regimes
        run: node scripts/build-sanctions.mjs

      - name: Refresh WITS export shares and partner lists
        run: node scripts/build-trade.mjs

      - name: Refresh World Bank GDP history
        run: node scripts/build-worldbank-history.mjs

      - name: Fill any countries missing from the elections table
        run: node scripts/build-elections.mjs

      - name: Refresh WITS export shares
        run: node scripts/build-trade.mjs

      - name: Refresh ACLED event counts (skipped without credentials)
        env:
          ACLED_EMAIL: ${{ secrets.ACLED_EMAIL }}
          ACLED_PASSWORD: ${{ secrets.ACLED_PASSWORD }}
        run: node scripts/build-acled.mjs

      - name: Refresh UCDP organised-violence deaths (skipped without token)
        env:
          UCDP_TOKEN: ${{ secrets.UCDP_TOKEN }}
        run: node scripts/build-ucdp.mjs

      - name: Validate
        run: pnpm run test

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data/refresh-${{ github.run_id }}
          delete-branch: true
          base: main
          add-paths: |
            src/data/conflicts.json
            src/data/unrest.json
            src/data/blocs.json
            src/data/displacement.generated.json
            src/data/worldbank.generated.json
            src/data/sanctions.generated.json
            src/data/elections.json
            src/data/acled.generated.json
            src/data/trade.generated.json
            src/data/worldbank-history.generated.json
            src/data/ucdp.generated.json
          commit-message: 'Data refresh: automated weekly research pass'
          title: 'Data refresh ${{ github.run_started_at }}'
          body-path: research-report.md
          labels: data-refresh
