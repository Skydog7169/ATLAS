<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#04070d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#dfe7ee" media="(prefers-color-scheme: light)" />
    <meta name="description" content="ATLAS — an interactive geopolitics map of power blocs and active conflicts." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <title>ATLAS</title>
    <script>
      // Apply the theme before first paint (mirrors src/lib/theme.ts): an embed's
      // link pins it (#embed=1&theme=light|dark|auto, dark by default); otherwise
      // the visitor's stored choice, else the OS preference.
      (function () {
        try {
          var p = new URLSearchParams(location.hash.replace(/^#/, ''));
          var t = p.get('embed') === '1' ? p.get('theme') || 'dark' : localStorage.getItem('atlas:theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
