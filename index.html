<!doctype html>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#04070d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#dfe7ee" media="(prefers-color-scheme: light)" />
    <!-- Apply the saved theme before first paint so a dark choice on a light OS (or the reverse) never flashes. -->
    <script>
      // Mirrors src/lib/theme.ts: an embed's link pins the theme (#embed=1&theme=light|dark|auto,
      // dark by default); otherwise the visitor's stored choice, else the OS preference.
      try {
        var p = new URLSearchParams(location.hash.replace(/^#/, ''));
        var t = p.get('embed') === '1' ? p.get('theme') || 'dark' : localStorage.getItem('atlas:theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
          document.querySelectorAll('meta[name=theme-color]').forEach(function (m) {
            m.removeAttribute('media');
            m.content = t === 'dark' ? '#04070d' : '#dfe7ee';
          });
        }
        if (p.get('brief') === '1' || p.get('embed') === '1') document.documentElement.setAttribute('data-chrome', 'none');
      } catch (e) {}
    </script>
    <title>ATLAS — alliances, wars and unrest</title>
